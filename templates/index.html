<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Practice</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d2939;
        background: #f4f7fb;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, textarea { font: inherit; }
      button { cursor: pointer; }

      .app {
        width: min(1120px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 24px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 230px;
        gap: 20px;
      }

      .chat, .details {
        background: #fff;
        border: 1px solid #e4eaf2;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgb(22 46 84 / 7%);
      }

      .chat { min-height: calc(100vh - 56px); display: flex; flex-direction: column; overflow: hidden; }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-bottom: 1px solid #edf0f5;
      }

      .title { margin: 0; font-size: 1.15rem; color: #183b70; }
      .subtitle { margin: 4px 0 0; color: #718096; font-size: .88rem; }
      .header-actions { display: flex; gap: 8px; }
      .secondary-btn, .end-btn, .send-btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 650; }
      .secondary-btn { color: #315784; background: #edf4ff; }
      .end-btn { color: #9b2c2c; background: #fff0ef; }

      .messages {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 24px;
        scroll-behavior: smooth;
      }

      .message-row { display: flex; }
      .message-row.user { justify-content: flex-end; }
      .message-bubble {
        max-width: min(82%, 650px);
        padding: 13px 16px;
        border-radius: 16px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .assistant .message-bubble { background: #f2f6fc; border-bottom-left-radius: 5px; }
      .user .message-bubble { color: #fff; background: #2863b5; border-bottom-right-radius: 5px; }
      .composer { padding: 16px 20px 18px; border-top: 1px solid #edf0f5; }
      .composer-row { display: flex; gap: 10px; align-items: flex-end; }
      textarea {
        flex: 1;
        min-height: 48px;
        max-height: 140px;
        resize: vertical;
        padding: 13px 14px;
        border: 1px solid #d6deea;
        border-radius: 12px;
        outline: none;
      }

      textarea:focus { border-color: #4a82cc; box-shadow: 0 0 0 3px rgb(74 130 204 / 13%); }
      .send-btn { min-width: 82px; height: 48px; color: #fff; background: #2863b5; }
      button:disabled, textarea:disabled { opacity: .58; cursor: not-allowed; }
      .request-status { min-height: 20px; margin: 9px 2px 0; color: #66758a; font-size: .86rem; }

      .details { align-self: start; padding: 20px; }
      .details h2 { margin: 0 0 18px; color: #183b70; font-size: 1rem; }
      .info { margin: 0; }
      .info div { padding: 12px 0; border-top: 1px solid #edf0f5; }
      .info dt { color: #758297; font-size: .78rem; }
      .info dd { margin: 5px 0 0; font-size: .96rem; font-weight: 650; }
      .score { color: #2863b5; }
      .summary { margin: 18px 0 0; color: #475569; font-size: .88rem; line-height: 1.5; }

      @media (max-width: 760px) {
        .app { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
        .chat { min-height: 70vh; }
        .details { order: -1; padding: 14px 18px; }
        .details h2 { margin-bottom: 8px; }
        .info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 14px; }
        .info div { padding: 8px 0; }
        .header { padding: 16px; }
        .messages { padding: 18px 14px; }
        .composer { padding: 12px; }
        .message-bubble { max-width: 92%; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="chat" aria-label="English conversation">
        <header class="header">
          <div>
            <h1 class="title">English practice</h1>
            <p class="subtitle">Answer in English. We’ll keep the conversation going.</p>
          </div>
          <div class="header-actions">
            <button id="new-chat" class="secondary-btn" type="button">New chat</button>
            <button id="end-chat" class="end-btn" type="button" disabled>End</button>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <div class="composer-row">
            <textarea id="message-input" rows="1" placeholder="Type your answer..." aria-label="Type your answer" disabled></textarea>
            <button id="send-btn" class="send-btn" type="submit" disabled>Send</button>
          </div>
          <p id="request-status" class="request-status" role="status"></p>
        </form>
      </section>

      <aside class="details" aria-label="Learning progress">
        <h2>This session</h2>
        <dl class="info">
          <div><dt>Topic</dt><dd id="topic">—</dd></div>
          <div><dt>English level</dt><dd id="level">—</dd></div>
          <div><dt>Turns</dt><dd id="turn-count">0</dd></div>
          <div><dt>Grammar</dt><dd id="grammar-score" class="score">—</dd></div>
          <div><dt>Vocabulary</dt><dd id="vocabulary-score" class="score">—</dd></div>
        </dl>
        <p id="summary" class="summary" aria-live="polite"></p>
      </aside>
    </main>

    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('message-input');
      const sendBtn = document.getElementById('send-btn');
      const newChatBtn = document.getElementById('new-chat');
      const endChatBtn = document.getElementById('end-chat');
      const composerEl = document.getElementById('composer');
      const requestStatusEl = document.getElementById('request-status');
      const topicEl = document.getElementById('topic');
      const levelEl = document.getElementById('level');
      const turnCountEl = document.getElementById('turn-count');
      const grammarScoreEl = document.getElementById('grammar-score');
      const vocabularyScoreEl = document.getElementById('vocabulary-score');
      const summaryEl = document.getElementById('summary');

      let isLoading = false;
      let isActive = false;

      function renderMessages(messages) {
        messagesEl.replaceChildren();
        for (const message of messages || []) {
          const row = document.createElement('div');
          row.className = `message-row ${message.role}`;
          const bubble = document.createElement('div');
          bubble.className = 'message-bubble';
          bubble.textContent = message.text;
          row.appendChild(bubble);
          messagesEl.appendChild(row);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function updateSummary(summary = {}) {
        topicEl.textContent = summary.topic || '—';
        levelEl.textContent = summary.learner_level || '—';
        turnCountEl.textContent = summary.question_count ?? 0;
        grammarScoreEl.textContent = summary.grammar_score === '—' || summary.grammar_score == null
          ? '—' : `${summary.grammar_score}/100`;
        vocabularyScoreEl.textContent = summary.vocabulary_score === '—' || summary.vocabulary_score == null
          ? '—' : `${summary.vocabulary_score}/100`;
        if (summary.status === 'completed') {
          summaryEl.textContent = `Session complete: ${summary.question_count || 0} turn(s).`;
        } else {
          summaryEl.textContent = '';
        }
      }

      function setLoading(loading, message = '') {
        isLoading = loading;
        sendBtn.disabled = loading || !isActive;
        inputEl.disabled = loading || !isActive;
        newChatBtn.disabled = loading;
        endChatBtn.disabled = loading || !isActive;
        sendBtn.textContent = loading ? 'Wait…' : 'Send';
        requestStatusEl.textContent = message;
      }

      function applyPayload(payload) {
        if (payload.messages) renderMessages(payload.messages);
        if (payload.summary) updateSummary(payload.summary);
        if (payload.status) isActive = payload.status === 'ready';
      }

      async function postJson(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {})
        });
        const payload = await response.json();
        if (!response.ok) {
          applyPayload(payload);
          const error = new Error(payload.error || 'The request could not be completed.');
          error.payload = payload;
          throw error;
        }
        return payload;
      }

      async function sendAnswer(event) {
        event.preventDefault();
        const answer = inputEl.value.trim();
        if (!answer || isLoading || !isActive) return;

        const previousValue = inputEl.value;
        inputEl.value = '';
        setLoading(true, 'Checking your answer…');
        try {
          const payload = await postJson('/api/submit-answer', { answer });
          applyPayload(payload);
          setLoading(false, payload.error || '');
        } catch (error) {
          if (!error.payload?.messages) inputEl.value = previousValue;
          setLoading(false, error.message || 'The server could not process your answer.');
        }
      }

      async function startNewChat() {
        if (isLoading) return;
        isActive = false;
        setLoading(true, 'Starting a new conversation…');
        messagesEl.replaceChildren();
        summaryEl.textContent = '';
        updateSummary();
        try {
          const payload = await postJson('/api/new-chat');
          applyPayload(payload);
          setLoading(false);
          inputEl.focus();
        } catch (error) {
          setLoading(false, error.message || 'The models are not ready. Please try again later.');
        }
      }

      async function endChat() {
        if (isLoading || !isActive) return;
        setLoading(true, 'Finishing your session…');
        try {
          const payload = await postJson('/api/end-chat');
          applyPayload(payload);
          isActive = false;
          setLoading(false);
        } catch (error) {
          setLoading(false, error.message || 'The session could not be ended.');
        }
      }

      composerEl.addEventListener('submit', sendAnswer);
      newChatBtn.addEventListener('click', startNewChat);
      endChatBtn.addEventListener('click', endChat);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          composerEl.requestSubmit();
        }
      });

      startNewChat();
    </script>
  </body>
</html>
